<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>품질팀 업무 포털</title>
<meta name="description" content="Ninebell 품질팀 업무 포털 — 앱 설치 및 바로가기">
<meta name="theme-color" content="#f6f8fa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="품질팀 포털">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#f3f5f9;--panel:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e3e7ee;--brand:#034ea1;--brand-soft:#e8f0fb}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px 22px 22px;box-shadow:0 8px 28px rgba(15,23,42,.08);text-align:center}
.app-ic{width:96px;height:96px;border-radius:22px;display:block;margin:0 auto 14px;box-shadow:0 4px 14px rgba(15,23,42,.12)}
.logo{height:20px;display:block;margin:0 auto 10px}
h1{font-size:21px;margin:0 0 6px}
.sub{color:var(--muted);font-size:14px;margin:0 0 22px;line-height:1.5}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:12px;font-size:16px;font-weight:700;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-decoration:none;cursor:pointer;margin-top:10px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn:active{transform:translateY(1px)}
.btn[hidden]{display:none}
.note{margin-top:16px;font-size:12.5px;color:var(--muted);line-height:1.55}
.ok{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--brand-soft);color:var(--brand);font-size:13.5px;font-weight:600}
.ok[hidden]{display:none}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.mask[hidden]{display:none}
.sheet{position:relative;width:100%;max-width:520px;background:var(--panel);border-radius:18px 18px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;text-align:left}
@media (min-width:700px){.mask{align-items:center}.sheet{border-radius:16px}}
.sheet h2{font-size:18px;margin:0 36px 12px 0}
.sheet ol{margin:0;padding-left:22px;line-height:1.7;font-size:15px}
.sheet li{margin-bottom:6px}
.sheet .hint{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.55}
.x{position:absolute;right:10px;top:10px;width:44px;height:44px;border:0;background:none;font-size:22px;color:var(--muted);cursor:pointer}
kbd{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;font:inherit;font-weight:700;background:#f8fafc}
.redirect{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main class="card" id="main">
  <img class="app-ic" src="icons/icon-192.png" alt="품질팀 포털 아이콘">
  <img class="logo" src="ninebell-logo.png" alt="Ninebell">
  <h1>품질팀 업무 포털</h1>
  <p class="sub" id="sub">홈 화면에 설치하면 앱처럼 바로 열 수 있습니다.</p>
  <button class="btn pri" id="btnInstall" type="button">📲 앱 설치</button>
  <a class="btn" id="btnOpen" href="#">포털 열기</a>
  <div class="ok" id="installed" hidden>이미 앱으로 설치되어 있습니다. 홈 화면의 ‘품질팀 포털’ 아이콘으로 여세요.</div>
  <p class="note">처음 열 때 회사 구글 계정으로 한 번 로그인해야 할 수 있습니다.</p>
</main>

<div class="mask" id="mask" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="gTitle">
    <button class="x" id="gClose" type="button" aria-label="닫기">✕</button>
    <h2 id="gTitle">앱 설치 방법</h2>
    <div id="gBody"></div>
    <button class="btn pri" id="gOk" type="button">확인</button>
  </div>
</div>

<script>
(function(){
  // Portal web app URL (stays the same across new versions of the same deployment)
  var PORTAL = 'https://script.google.com/macros/s/AKfycbyPWvlCkF-d071K5rKVgRgGXE6H9hVm8MQ9t6xnfvL8aoxyBMFL1ujO6A9oKnUz7ZM8/exec';
  var $ = function(id){ return document.getElementById(id); };
  var ua = navigator.userAgent;
  var isStandalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  var isInApp = /KAKAOTALK|NAVER|Line\/|FBAN|FBAV|Instagram|DaumApps|; wv\)|Whale\/.*Mobile.*inapp/i.test(ua);
  var isIOSSafari = isIOS && /Safari/i.test(ua) && !/CriOS|FxiOS|EdgiOS|Whale/i.test(ua);
  var deferred = null;

  $('btnOpen').href = PORTAL;

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }

  // Opened from the home-screen icon -> go straight to the portal
  if (isStandalone) {
    $('main').innerHTML = '<img class="app-ic" src="icons/icon-192.png" alt=""><p class="redirect">포털을 여는 중…</p>' +
      '<a class="btn pri" href="' + PORTAL + '">열리지 않으면 여기를 누르세요</a>';
    location.replace(PORTAL);
    return;
  }

  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferred = e; });
  window.addEventListener('appinstalled', function(){ deferred = null; $('installed').hidden = false; $('btnInstall').hidden = true; });
  if (navigator.getInstalledRelatedApps) {
    navigator.getInstalledRelatedApps().then(function(a){ if (a && a.length) $('installed').hidden = false; }).catch(function(){});
  }

  function guide(title, html){
    $('gTitle').textContent = title; $('gBody').innerHTML = html; $('mask').hidden = false; $('gOk').focus();
  }
  function closeGuide(){ $('mask').hidden = true; }
  // Pop-ups close only by ✕ / 확인 / Esc (not by clicking outside)
  $('gClose').onclick = closeGuide; $('gOk').onclick = closeGuide;
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !$('mask').hidden) closeGuide(); });

  function copyLink(){
    var u = location.href.split('#')[0];
    (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(function(){
      $('copyMsg').textContent = '주소를 복사했습니다. 브라우저 주소창에 붙여넣으세요.';
    }).catch(function(){ $('copyMsg').textContent = u; });
  }

  $('btnInstall').onclick = function(){
    if (deferred) {
      deferred.prompt();
      deferred.userChoice.finally(function(){ deferred = null; });
      return;
    }
    if (isInApp) {
      guide('다른 브라우저에서 열어 주세요',
        '<ol><li>카카오톡 등 앱 안의 브라우저에서는 설치가 되지 않습니다.</li>' +
        '<li>오른쪽 위(또는 아래) <kbd>⋮</kbd> / <kbd>공유</kbd> 메뉴에서 <b>' + (isIOS ? 'Safari로 열기' : '다른 브라우저로 열기(Chrome)') + '</b>를 누르세요.</li>' +
        '<li>열린 화면에서 다시 <b>앱 설치</b>를 누르세요.</li></ol>' +
        '<button class="btn" id="copyBtn" type="button">주소 복사</button><p class="hint" id="copyMsg"></p>');
      $('copyBtn').onclick = copyLink;
      return;
    }
    if (isIOS) {
      guide('iPhone · iPad 설치 방법',
        (isIOSSafari ? '' : '<p class="hint" style="margin-top:0">Safari에서 열어야 설치할 수 있습니다. 이 주소를 Safari에서 열어 주세요.</p>') +
        '<ol><li>Safari 아래(또는 위)의 <kbd>공유</kbd> 버튼(□↑)을 누르세요.</li>' +
        '<li>목록을 내려 <b>홈 화면에 추가</b>를 누르세요.</li>' +
        '<li>오른쪽 위 <b>추가</b>를 누르면 홈 화면에 ‘품질팀 포털’ 아이콘이 생깁니다.</li></ol>' +
        '<p class="hint">처음 열 때 구글 계정으로 한 번 로그인해야 할 수 있습니다.</p>');
      return;
    }
    if (isAndroid) {
      guide('안드로이드 설치 방법',
        '<ol><li>Chrome 오른쪽 위 <kbd>⋮</kbd> 메뉴를 누르세요.</li>' +
        '<li><b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 누르세요.</li>' +
        '<li><b>설치</b>를 누르면 홈 화면에 ‘품질팀 포털’ 아이콘이 생깁니다.</li></ol>' +
        '<p class="hint">삼성 인터넷은 아래 메뉴 <kbd>≡</kbd> → <b>현재 페이지 추가</b> → <b>홈 화면</b>.</p>');
      return;
    }
    guide('PC 설치 방법',
      '<ol><li>Chrome / Edge 주소창 오른쪽의 <b>설치</b> 아이콘(⊕ 또는 모니터 모양)을 누르세요.</li>' +
      '<li>없으면 <kbd>⋮</kbd> 메뉴 → <b>전송, 저장, 공유</b> → <b>페이지를 앱으로 설치</b> (Edge: <kbd>…</kbd> → 앱 → 이 사이트를 앱으로 설치).</li></ol>' +
      '<p class="hint">설치하면 바탕화면/시작 메뉴에서 바로 열 수 있습니다.</p>');
  };
})();
</script>
</body>
</html>
