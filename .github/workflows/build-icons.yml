name: Build icons
# Builds icons/*.png (Q badge) and ninebell-logo.png from the 부적합 변환기 assets and commits them.
on:
  push:
    branches: [main]
    paths: ['tools/make_icons.py', '.github/workflows/build-icons.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SRC: https://raw.githubusercontent.com/SB4165/Ninebell_Defect-Label/c0b2e462c07982538039c2260444f29eee781bb6
    steps:
      - uses: actions/checkout@v4
      - name: Fetch source assets
        run: |
          mkdir -p /tmp/src icons
          for n in icon-192 favicon-32 icon-512 icon-maskable-512 apple-touch-icon; do
            curl -sSfo /tmp/src/$n.png "$SRC/icons/$n.png"
          done
          curl -sSfo ninebell-logo.png "$SRC/ninebell-logo.png"
      - name: Build Q icons
        run: |
          sudo apt-get install -y -qq fonts-liberation >/dev/null
          pip install -q pillow numpy
          python tools/make_icons.py /tmp/src icons
          ls -la icons
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add icons ninebell-logo.png
          git diff --cached --quiet || git commit -m "Build Q icons [bot]"
          git push
